# The app's routes on members.cimcha.com. deploy/deploy.sh wraps this in the
# HTTP and HTTPS server blocks (with the TLS certificate), installs it as
# /etc/nginx/snippets/members-app.conf and rewrites the site file on every run,
# so nothing here is ever edited by hand or by certbot.
#
#   /api/...        → the API on 127.0.0.1:4000 (prefix stripped), including
#                     /api/socket.io/ for live chat and /api/uploads/ for photos
#   everything else → the web app (static files from `npm run export:web`)
#
# The app and API share an origin, so the browser never makes cross-origin calls.

root /var/www/members;

location /api/socket.io/ {
    proxy_pass http://127.0.0.1:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

location /api/ {
    client_max_body_size 10m;   # profile photo uploads (API limit is 8 MB)
    proxy_pass http://127.0.0.1:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Hashed bundles never change; index.html must always be fresh.
location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
