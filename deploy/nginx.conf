# /etc/nginx/sites-available/classes  — API + real-time chat
# Issue TLS certs with: sudo certbot --nginx -d api.classes.example.org
server {
    listen 80;
    server_name api.classes.example.org;

    client_max_body_size 2m;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Web version of the app: static files from `npm run export:web` in apps/mobile.
server {
    listen 80;
    server_name classes.example.org;
    root /var/www/classes;
    location / {
        try_files $uri /index.html;
    }
}
